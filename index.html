<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九九シャトルラン</title><style>
:root{font-family:system-ui,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#18304a;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:auto;padding:22px 16px 48px}h1{font-size:clamp(26px,5vw,38px);margin:0 0 6px}.sub{color:#60738b;margin:0 0 22px}.card{background:white;border:1px solid #e0e8f2;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #23405a0a}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{background:#e8f2ff;color:#1761b5;border-radius:100px;padding:7px 13px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stage{border:1px solid #dbe5ef;border-radius:12px;padding:12px 5px;text-align:center;background:#f8fafc}.stage b{display:block;font-size:22px}.stage small{display:block;color:#66798d}.stage.done{background:#fff5d9;border-color:#f1c55b}.stage.done b{color:#b87a00}.stage.active{outline:3px solid #6ca8f6}.row{display:grid;grid-template-columns:80px 1fr 95px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.stars{display:flex;gap:5px}.star{font-size:24px;color:#cad5e0}.star.yes{color:#e7aa19}.time{text-align:right;color:#52667b;font-variant-numeric:tabular-nums}.btn{appearance:none;border:0;border-radius:14px;background:#176bcb;color:white;font-size:18px;font-weight:800;padding:14px 20px;cursor:pointer;min-height:50px}.btn.secondary{background:#e8eff8;color:#284e77}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.select{font:inherit;font-weight:700;padding:10px;border:1px solid #c8d8e7;border-radius:12px;background:white}.question{text-align:center;font-weight:900;font-size:clamp(48px,12vw,86px);margin:26px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{font-size:clamp(26px,7vw,46px);padding:20px 4px;border:3px solid #cfe1f4;background:#f4f9ff;color:#143e69;border-radius:20px;cursor:pointer;font-weight:900;min-height:100px}.choice:disabled{cursor:default}.choice.correct{background:#d7f9e2;border-color:#29ae61;color:#166333}.choice.wrong{background:#ffe0e0;border-color:#e05d5d;color:#a22424}.progress{height:12px;border-radius:30px;background:#e6edf5;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#2980dc;transition:width .2s}.muted{color:#65788b}.feedback{min-height:30px;text-align:center;font-size:20px;font-weight:800}.big{font-size:clamp(26px,6vw,42px);font-weight:900}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.metric{background:#f3f7fb;border-radius:14px;padding:15px}.metric strong{display:block;font-size:27px}.note{font-size:13px;color:#65788b;line-height:1.6}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:24px}.section-title{margin:0 0 10px}.pill{border-radius:99px;padding:5px 10px;background:#eef3f9;color:#375b80;font-size:13px;font-weight:700}@media(max-width:520px){.wrap{padding:16px 10px 32px}.card{padding:16px}.row{grid-template-columns:65px 1fr 72px;gap:4px}.star{font-size:20px}.time{font-size:12px}.choices{gap:7px}.choice{min-height:84px}.grid{gap:5px}.stage{padding:10px 2px}.stage b{font-size:19px}}
</style></head><body><main class="wrap"><header><h1>⚡ 九九シャトルラン</h1><p class="sub">3問 → 5問 → 7問 → 9問！ ぜんぶ正解して、きろくをのばそう。</p></header>
<section id="home" class="card"><div class="head"><h2 class="section-title">ちょうせんする だん</h2><span id="total" class="badge">★ 0 / 36</span></div><div id="rows"></div><div class="actions"><label for="dan">えらぶ：</label><select class="select" id="dan"></select><button id="start" class="btn">このだんに ちょうせん ▶</button></div><p class="note">各だん4ステージ、合計24問。クリアしたステージは★になります。まちがえたステージからやりなおせます。きろくはこのブラウザに保存されます。</p></section>
<section id="play" class="card hidden"><div class="topline"><span id="playDan" class="badge"></span><span id="level" class="pill"></span><span id="timer" class="timer">0.0秒</span></div><div id="stages" class="grid" style="margin-top:20px"></div><div class="topline" style="margin-top:22px"><b id="counter">1 / 3</b><span id="mistakes" class="muted">ミス 0</span></div><div class="progress"><div id="bar" style="width:0%"></div></div><div id="question" class="question">3 × 2 = ?</div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="quit" class="btn secondary">やめる</button></div></section>
<section id="result" class="card hidden"><div id="resultHeading" class="big"></div><p id="resultMsg" class="muted"></p><div id="resultStats" class="summary"></div><div class="actions"><button id="continue" class="btn">つぎへ ▶</button><button id="retry" class="btn secondary">このステージを もういちど</button><button id="back" class="btn secondary">だんを えらぶ</button></div></section>
</main><script>
(()=>{'use strict';const sizes=[3,5,7,9],key='kuku-shuttle-v1';let records={};try{records=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{};const $=id=>document.getElementById(id),els={home:$('home'),play:$('play'),result:$('result')};let dan=3,stage=0,questions=[],index=0,wrong=0,stageStart=0,stageElapsed=0,runTotal=0,runStarted=false,locked=false,tick=null,delay=null,attempts=[];const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a},fmt=t=>(t/1000).toFixed(1)+'秒';function rec(d){return records[d]||(records[d]={cleared:[false,false,false,false],best:[null,null,null,null],totalBest:null})}function save(){try{localStorage.setItem(key,JSON.stringify(records))}catch{}}function show(id){Object.entries(els).forEach(([k,e])=>e.classList.toggle('hidden',k!==id))}function home(){clearInterval(tick);clearTimeout(delay);renderHome();show('home')}
function renderHome(){let stars=0;const rows=$('rows');rows.replaceChildren();for(let d=1;d<=9;d++){let r=rec(d);stars+=r.cleared.filter(Boolean).length;const row=document.createElement('div');row.className='row';const name=document.createElement('b');name.textContent=d+'のだん';const st=document.createElement('div');st.className='stars';sizes.forEach((n,i)=>{const x=document.createElement('span');x.className='star'+(r.cleared[i]?' yes':'');x.textContent=r.cleared[i]?'★':'☆';x.title=n+'問';st.append(x)});const t=document.createElement('div');t.className='time';t.textContent=r.totalBest!=null?fmt(r.totalBest):'―';row.append(name,st,t);rows.append(row)}$('total').textContent='★ '+stars+' / 36';$('dan').value=String(dan)}for(let d=1;d<=9;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'のだん';$('dan').append(o)}
function makeChoices(a,b){const correct=a*b;let pool=new Set();for(const v of [a*(b-1),a*(b+1),(a-1)*b,(a+1)*b,correct-1,correct+1,correct-2,correct+2,correct-3,correct+3,correct-7,correct+7])if(v>0&&v<=81&&v!==correct)pool.add(v);let near=[...pool].sort((x,y)=>Math.abs(x-correct)-Math.abs(y-correct));let neighbors=[a*(b-1),a*(b+1)].filter(v=>v>0&&v<=81&&v!==correct);shuffle(neighbors);let distractors=[];if(neighbors.length)distractors.push(neighbors[0]);const others=shuffle(near.filter(v=>!distractors.includes(v)));for(let v of others){if(distractors.length>=2)break;distractors.push(v)}while(distractors.length<2){let v=rand(81)+1;if(v!==correct&&!distractors.includes(v))distractors.push(v)}return shuffle([correct,...distractors])}
function buildQuestions(){let nums=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,sizes[stage]);return nums.map(b=>({b,options:makeChoices(dan,b)}))}function renderStages(){let box=$('stages');box.replaceChildren();sizes.forEach((n,i)=>{let div=document.createElement('div');div.className='stage'+(i===stage?' active':'')+(rec(dan).cleared[i]?' done':'');div.innerHTML='<small>LEVEL '+(i+1)+'</small><b>'+n+'もん</b>';box.append(div)})}
function begin(d,st=0,newRun=true){clearTimeout(delay);clearInterval(tick);dan=d;stage=st;if(newRun){runTotal=0;runStarted=true}questions=buildQuestions();index=0;wrong=0;attempts=[];locked=false;stageStart=performance.now();$('playDan').textContent=dan+'のだん';$('level').textContent='LEVEL '+(stage+1);$('mistakes').textContent='ミス 0';renderStages();show('play');renderQuestion();tick=setInterval(()=>{$('timer').textContent=fmt(performance.now()-stageStart)},80)}function renderQuestion(){locked=false;const q=questions[index];$('counter').textContent=(index+1)+' / '+questions.length;$('bar').style.width=(index/questions.length*100)+'%';$('question').textContent=dan+' × '+q.b+' = ?';$('feedback').textContent='';const box=$('choices');box.replaceChildren();q.options.forEach(v=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=v;btn.addEventListener('click',()=>answer(v));box.append(btn)})}
function answer(value){if(locked)return;locked=true;let q=questions[index],correct=dan*q.b,ok=value===correct;attempts.push({b:q.b,ok});if(!ok)wrong++;$('mistakes').textContent='ミス '+wrong;for(const btn of $('choices').children){btn.disabled=true;if(Number(btn.textContent)===correct)btn.classList.add('correct');else if(Number(btn.textContent)===value&&!ok)btn.classList.add('wrong')}$('feedback').textContent=ok?'せいかい！':'こたえは '+correct+' だよ';delay=setTimeout(()=>{index++;if(index>=questions.length)finish();else renderQuestion()},ok?360:1000)}
function finish(){clearInterval(tick);stageElapsed=performance.now()-stageStart;runTotal+=stageElapsed;$('bar').style.width='100%';const cleared=wrong===0,r=rec(dan),prev=r.best[stage];if(cleared){r.cleared[stage]=true;if(prev==null||stageElapsed<prev)r.best[stage]=stageElapsed;if(stage===3&&runStarted){if(r.totalBest==null||runTotal<r.totalBest)r.totalBest=runTotal}}save();const personal=cleared&&(prev==null||stageElapsed<prev);$('resultHeading').textContent=cleared?(stage===3?'🎉 '+dan+'のだん ぜんぶクリア！':'⭐ LEVEL '+(stage+1)+' クリア！'):'あとすこし！';$('resultMsg').textContent=cleared?(personal?'ベストきろく こうしん！':'ぜんもん せいかい！'):'まちがえた もんだいを もういちど やってみよう。';$('resultStats').innerHTML='<div class="metric">せいかい<strong>'+(questions.length-wrong)+' / '+questions.length+'</strong></div><div class="metric">タイム<strong>'+fmt(stageElapsed)+'</strong></div><div class="metric">このだんの合計<strong>'+fmt(runTotal)+'</strong></div><div class="metric">ステージのベスト<strong>'+(r.best[stage]!=null?fmt(r.best[stage]):'―')+'</strong></div>';$('continue').classList.toggle('hidden',!cleared||stage===3);$('retry').textContent=cleared?'もういちど ちょうせん':'このステージを やりなおす';show('result')}
$('dan').addEventListener('change',e=>dan=Number(e.target.value));$('start').addEventListener('click',()=>begin(dan,0,true));$('quit').addEventListener('click',home);$('back').addEventListener('click',home);$('retry').addEventListener('click',()=>begin(dan,stage,true));$('continue').addEventListener('click',()=>{if(stage<3)begin(dan,stage+1,false)});renderHome();})();
</script></body></html>
